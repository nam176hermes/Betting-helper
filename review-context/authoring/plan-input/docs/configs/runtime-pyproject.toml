[project]
name = "moj-discovery-repo0"
version = "6.2.0"
description = "Authoring-only REPO0 governance and typed discovery contract stubs"
requires-python = "==3.12.3"
dependencies = [
  "cryptography==50.0.1",
  "jsonschema==4.26.0",
  "rfc8785==0.1.4",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.uv]
package = false
required-version = "==0.11.7"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = [".", "src"]
testpaths = ["tests", "../authoring-tests"]
cache_dir = "/home/thenam176/betting-helper/authoring-evidence/hybrid-discovery-v6.3.6/pytest-cache"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests", "tools"]
exclude = ["tests-red"]
