{
  "name": "Verification",
  "on": {
    "pull_request": {},
    "push": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "portable": {
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "name": "Checkout (actions/checkout v4.4.0)",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "name": "Set up Node (actions/setup-node v4.4.0)",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.23.0"
          }
        },
        {
          "name": "Set up uv (astral-sh/setup-uv v7.6.0)",
          "uses": "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78",
          "with": {
            "version": "0.11.7",
            "enable-cache": true
          }
        },
        {
          "name": "Provision locked dependencies",
          "run": "uv python install 3.12.3\nuv sync --frozen\ncorepack enable\ncorepack prepare pnpm@10.33.2 --activate\npnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Run portable verification offline",
          "shell": "bash",
          "env": {
            "NPM_CONFIG_IGNORE_SCRIPTS": "true",
            "UV_NO_PROGRESS": "1",
            "UV_PYTHON_DOWNLOADS": "never"
          },
          "run": "mkdir -p .local/ci\nuv run --frozen --offline python tools/verify_local.py --profile portable | tee .local/ci/portable-verification.json"
        },
        {
          "name": "Publish sanitized portable evidence (actions/upload-artifact v4.6.2)",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "portable-verification",
            "path": ".local/ci/portable-verification.json",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    },
    "browser-qualification": {
      "if": "github.event_name == 'workflow_dispatch'",
      "needs": "portable",
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "name": "Checkout (actions/checkout v4.4.0)",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "name": "Set up Node (actions/setup-node v4.4.0)",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22.23.0"
          }
        },
        {
          "name": "Set up uv (astral-sh/setup-uv v7.6.0)",
          "uses": "astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78",
          "with": {
            "version": "0.11.7",
            "enable-cache": true
          }
        },
        {
          "name": "Provision locked dependencies",
          "run": "uv python install 3.12.3\nuv sync --frozen\ncorepack enable\ncorepack prepare pnpm@10.33.2 --activate\npnpm install --frozen-lockfile --ignore-scripts"
        },
        {
          "name": "Run isolated browser qualification",
          "env": {
            "NPM_CONFIG_IGNORE_SCRIPTS": "true",
            "UV_NO_PROGRESS": "1",
            "UV_PYTHON_DOWNLOADS": "never"
          },
          "run": "mkdir -p .local/ci\npnpm --dir extension exec tsc -p tsconfig.test.json\nbrowser_binary=\"$(command -v google-chrome || command -v google-chrome-stable || true)\"\nset +e\nuv run --frozen --offline python tools/qualify_chrome_indexeddb.py --transport pipe --workspace \"$RUNNER_TEMP/browser-qualification\" --browser-binary \"${browser_binary:-$RUNNER_TEMP/browser-unavailable}\" > \"$RUNNER_TEMP/browser-raw.json\" 2> \"$RUNNER_TEMP/browser-stderr.log\"\nqualifier_exit=$?\nset -e\nQUALIFIER_EXIT=$qualifier_exit uv run --frozen --offline python - <<'PY'\nimport json\nimport os\nimport sys\nfrom pathlib import Path\n\nraw = Path(os.environ['RUNNER_TEMP']) / 'browser-raw.json'\ntry:\n    payload = json.loads(raw.read_text()) if int(os.environ['QUALIFIER_EXIT']) == 0 else {}\nexcept (OSError, json.JSONDecodeError):\n    payload = {}\nbrowser = payload.get('browser') if isinstance(payload.get('browser'), dict) else {}\nextension = payload.get('extension') if isinstance(payload.get('extension'), dict) else {}\nmodule = payload.get('module') if isinstance(payload.get('module'), dict) else {}\nstatus = payload.get('result', 'FAIL')\nsummary = {\n    'schema_version': 'browser-qualification-summary/v1',\n    'status': status,\n    'attempted_real_browser': payload.get('attempted_real_browser', False),\n    'blocker_code': payload.get('blocker_code'),\n    'browser': {'version': browser.get('version'), 'sha256': browser.get('sha256')},\n    'extension_module_sha256': extension.get('module_sha256') or module.get('expected_sha256'),\n    'production_authority': 'NONE',\n}\nPath('.local/ci/browser-summary.json').write_text(json.dumps(summary, sort_keys=True) + '\\n')\nif status == 'BLOCKED_ENVIRONMENT':\n    sys.exit(2)\nif status != 'PASS':\n    sys.exit(1)\nPY"
        },
        {
          "name": "Publish sanitized evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "browser-qualification",
            "path": ".local/ci/browser-summary.json",
            "include-hidden-files": true,
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
